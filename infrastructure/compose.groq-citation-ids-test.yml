name: proofline-groq-citation-ids-test

services:
  app:
    environment:
      APP_ORIGIN: http://127.0.0.1:${PROOFLINE_CITATION_IDS_TEST_PORT:-8019}
      LIVE_ENABLED: ${PROOFLINE_CITATION_IDS_LIVE_ENABLED:-false}
      LLM_PROVIDER: groq
      LLM_MODEL: qwen/qwen3.8-27b
      LLM_API_KEY: ${PROOFLINE_CITATION_IDS_GROQ_API_KEY:-}
      OPENAI_API_KEY: ""
      GROQ_REASONING_EFFORT: ${PROOFLINE_CITATION_IDS_REASONING_EFFORT:-medium}
      GROQ_PROMPT_PROFILE: v3.3-citation-ids-test
      GROQ_TEST_LOOKUP_SOURCES: ${PROOFLINE_CITATION_IDS_LOOKUP_SOURCES:-null}
      GROQ_TEST_ACCEPTANCE_REPLIES: ${PROOFLINE_CITATION_IDS_ACCEPTANCE_REPLIES:-null}
      GROQ_TEST_REQUIRED_EVENTS: ${PROOFLINE_CITATION_IDS_REQUIRED_EVENTS:-null}
      GROQ_TEST_CASE_EVIDENCE: ${PROOFLINE_CITATION_IDS_CASE_EVIDENCE:-null}
      MODEL_TIMEOUT_SECONDS: "90"
      MODEL_MAX_OUTPUT_TOKENS: ${PROOFLINE_CITATION_IDS_MAX_OUTPUT_TOKENS:-4096}
    ports: !override
      - "127.0.0.1:${PROOFLINE_CITATION_IDS_TEST_PORT:-8019}:8000"
