name: proofline-groq-confirmations-test

services:
  app:
    environment:
      APP_ORIGIN: http://127.0.0.1:${PROOFLINE_CONFIRMATIONS_TEST_PORT:-8015}
      LIVE_ENABLED: ${PROOFLINE_CONFIRMATIONS_LIVE_ENABLED:-false}
      LLM_PROVIDER: groq
      LLM_MODEL: qwen/qwen3.8-27b
      LLM_API_KEY: ${PROOFLINE_CONFIRMATIONS_GROQ_API_KEY:-}
      OPENAI_API_KEY: ""
      GROQ_REASONING_EFFORT: medium
      GROQ_PROMPT_PROFILE: v3.3-confirmations-test
      GROQ_TEST_LOOKUP_SOURCES: ${PROOFLINE_CONFIRMATIONS_LOOKUP_SOURCES:-null}
      GROQ_TEST_ACCEPTANCE_REPLIES: ${PROOFLINE_CONFIRMATIONS_ACCEPTANCE_REPLIES:-null}
      MODEL_TIMEOUT_SECONDS: "90"
      MODEL_MAX_OUTPUT_TOKENS: "4096"
    ports: !override
      - "127.0.0.1:${PROOFLINE_CONFIRMATIONS_TEST_PORT:-8015}:8000"
