[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proofline"
version = "0.1.0"
description = "Evidence-backed case assembly for operator review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "contracts/", "fixtures/", "evals/", "docs/", ".github/",
    "pyproject.toml", "uv.lock", "README.md", "AGENTS.md",
    ".gitattributes", ".gitignore", ".python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["proofline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
