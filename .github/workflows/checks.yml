name: Checks

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked mypy src
      - name: Test runtime library
        run: uv run --locked pytest --cov=proofline --cov-report=term-missing
      - name: Check generated schema
        run: uv run --locked python -m proofline.schema --check contracts/assembly-output.schema.json
      - name: Test frozen research baseline
        run: uv run --locked python -B -X utf8 -m unittest discover -s evals/baselines/v3 -p "test_*.py"
      - name: Verify recorded research results
        run: uv run --locked python -B -X utf8 evals/baselines/v3/verify.py
      - name: Build distributions
        run: uv build
