<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1336" viewBox="0 0 1200 1336" role="img" aria-labelledby="title desc"><title id="title">Proofline: карта продукта</title><desc id="desc">Источники, разбор AI, проверки кода и решение человека. React показывает карточку, FastAPI обслуживает процесс, PostgreSQL хранит версии. Два режима: сохранённый Replay и новый Live.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="1336" rx="0" fill="#f6f3eb"/><text x="48" y="44" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">PROOFLINE / КАРТА ПРОДУКТА</text><text x="48" y="103" font-size="43" fill="#142b35" font-weight="600" >От обращения к проверенному разбору</text><text x="48" y="145" font-size="23" fill="#4e6367" font-weight="400" >Оператор видит вывод, его основание и то, чего ещё не хватает.</text><g class="product-node" data-x="48" data-y="184" data-width="1104" data-height="116"><rect x="48" y="184" width="1104" height="116" rx="14" fill="#e4eee6"/><rect x="48" y="203" width="4" height="78" rx="2" fill="#14655c"/><text x="72" y="223" font-size="26" fill="#142b35" font-weight="600" >Обращение и выбранные источники</text><text x="72" y="257" font-size="20" fill="#4e6367" font-weight="400" >Письма клиента · ответы поставщика · журналы событий · банковские записи</text></g><line x1="316" y1="302" x2="316" y2="333" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><g class="product-node" data-x="48" data-y="340" data-width="536" data-height="164"><rect x="48" y="340" width="536" height="164" rx="14" fill="#e5edf5"/><rect x="48" y="359" width="4" height="126" rx="2" fill="#275b8c"/><text x="72" y="379" font-size="26" fill="#142b35" font-weight="600" >AI готовит разбор</text><text x="72" y="413" font-size="20" fill="#4e6367" font-weight="400" >Факты и подтверждающие фрагменты</text><text x="72" y="441" font-size="20" fill="#4e6367" font-weight="400" >События со временем и его смыслом</text><text x="72" y="469" font-size="20" fill="#4e6367" font-weight="400" >Недостающие сведения и следующий шаг</text></g><g class="product-node" data-x="616" data-y="340" data-width="536" data-height="164"><rect x="616" y="340" width="536" height="164" rx="14" fill="#fffefb"/><rect x="616" y="359" width="4" height="126" rx="2" fill="#14655c"/><text x="640" y="379" font-size="26" fill="#142b35" font-weight="600" >Приложение проверяет</text><text x="640" y="413" font-size="20" fill="#4e6367" font-weight="400" >Форму ответа и принадлежность источников</text><text x="640" y="441" font-size="20" fill="#4e6367" font-weight="400" >Дословность и положение фрагментов</text><text x="640" y="469" font-size="20" fill="#4e6367" font-weight="400" >Заданные правила согласованности</text></g><line x1="585" y1="422" x2="612" y2="422" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="884" y1="509" x2="884" y2="540" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><g class="product-node" data-x="48" data-y="548" data-width="1104" data-height="145"><rect x="48" y="548" width="1104" height="145" rx="14" fill="#e4eee6"/><rect x="48" y="567" width="4" height="107" rx="2" fill="#14655c"/><text x="72" y="587" font-size="26" fill="#142b35" font-weight="600" >Оператор сопоставляет результат с документами</text><text x="72" y="621" font-size="20" fill="#4e6367" font-weight="400" >Открывает цитаты · проверяет смысл и полноту · исправляет с пояснением</text><text x="72" y="649" font-size="20" fill="#4e6367" font-weight="400" >Подтверждает или отклоняет конкретную версию разбора</text></g><text x="48" y="744" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">КАК ЭТО УСТРОЕНО</text><g class="product-node" data-x="48" data-y="769" data-width="536" data-height="137"><rect x="48" y="769" width="536" height="137" rx="14" fill="#fffefb"/><rect x="48" y="788" width="4" height="99" rx="2" fill="#14655c"/><text x="72" y="808" font-size="26" fill="#142b35" font-weight="600" >React + TypeScript</text><text x="72" y="842" font-size="20" fill="#4e6367" font-weight="400" >Карточка, источники, выделение цитат</text><text x="72" y="870" font-size="20" fill="#4e6367" font-weight="400" >Редактор, замечания и история</text></g><g class="product-node" data-x="616" data-y="769" data-width="536" data-height="137"><rect x="616" y="769" width="536" height="137" rx="14" fill="#fffefb"/><rect x="616" y="788" width="4" height="99" rx="2" fill="#14655c"/><text x="640" y="808" font-size="26" fill="#142b35" font-weight="600" >Python + FastAPI</text><text x="640" y="842" font-size="20" fill="#4e6367" font-weight="400" >Анализ, проверки и решения</text><text x="640" y="870" font-size="20" fill="#4e6367" font-weight="400" >Один backend для всего процесса</text></g><g class="product-node" data-x="48" data-y="930" data-width="536" data-height="137"><rect x="48" y="930" width="536" height="137" rx="14" fill="#fffefb"/><rect x="48" y="949" width="4" height="99" rx="2" fill="#14655c"/><text x="72" y="969" font-size="26" fill="#142b35" font-weight="600" >PostgreSQL</text><text x="72" y="1003" font-size="20" fill="#4e6367" font-weight="400" >Версии документов и разборов</text><text x="72" y="1031" font-size="20" fill="#4e6367" font-weight="400" >Результаты проверок и решения человека</text></g><g class="product-node" data-x="616" data-y="930" data-width="536" data-height="137"><rect x="616" y="930" width="536" height="137" rx="14" fill="#fffefb"/><rect x="616" y="949" width="4" height="99" rx="2" fill="#14655c"/><text x="640" y="969" font-size="26" fill="#142b35" font-weight="600" >Docker Compose</text><text x="640" y="1003" font-size="20" fill="#4e6367" font-weight="400" >Локальный запуск приложения и базы</text><text x="640" y="1031" font-size="20" fill="#4e6367" font-weight="400" >Подготовленные учебные обращения</text></g><rect x="48" y="1097" width="1104" height="120" rx="14" fill="#142b35"/><text x="72" y="1137" font-size="26" fill="#fffefb" font-weight="600" >Два способа получить разбор</text><text x="72" y="1175" font-size="22" fill="#e0e9e7" font-weight="400" >Replay: сохранённый ответ   /   Live: новый запрос к выбранной модели</text><text x="48" y="1258" font-size="20" fill="#4e6367" font-weight="400" >OpenAI · Groq · DeepSeek · Anthropic: один провайдер на запуск, собственный API-доступ.</text><text x="48" y="1300" font-size="21" fill="#14655c" font-weight="400" >Документы → разбор → проверка → решение. Каждый шаг сохраняет своё происхождение.</text></g></svg>
