<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Условное согласие: от ошибки к правке</title><desc id="desc">Модель отметила условное согласие и принятую альтернативу одновременно. Приложение блокирует подтверждение. Оператор сверяет письмо, исправляет событие и сохраняет новую версию.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="920" rx="0" fill="#f6f3eb"/><text x="48" y="44" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">РАЗБОР / УСЛОВНОЕ СОГЛАСИЕ</text><text x="48" y="102" font-size="43" fill="#142b35" font-weight="600" >Одно слово ещё не закрывает вопрос</text><rect x="48" y="142" width="1104" height="119" rx="14" fill="#142b35"/><text x="72" y="182" font-size="20" fill="#d0dfd9" font-weight="600" >Письмо клиента</text><text x="72" y="224" font-size="26" fill="#fffefb" font-weight="400" >&quot;Если там тихий номер с окнами во двор, согласен на соседний корпус&quot;</text><g class="product-node" data-x="48" data-y="302" data-width="536" data-height="169"><rect x="48" y="302" width="536" height="169" rx="14" fill="#f5e6d9"/><rect x="48" y="321" width="4" height="131" rx="2" fill="#a34a2f"/><text x="72" y="341" font-size="26" fill="#142b35" font-weight="600" >В сохранённом ответе модели</text><text x="72" y="375" font-size="20" fill="#4e6367" font-weight="400" >Факт: согласие с условиями</text><text x="72" y="403" font-size="20" fill="#4e6367" font-weight="400" >Событие: альтернатива принята</text><text x="72" y="431" font-size="20" fill="#4e6367" font-weight="400" >Два утверждения расходятся</text></g><g class="product-node" data-x="616" data-y="302" data-width="536" data-height="169"><rect x="616" y="302" width="536" height="169" rx="14" fill="#f5e6d9"/><rect x="616" y="321" width="4" height="131" rx="2" fill="#a34a2f"/><text x="640" y="341" font-size="26" fill="#142b35" font-weight="600" >Замечание приложения</text><text x="640" y="375" font-size="20" fill="#4e6367" font-weight="400" >Условное согласие нельзя отметить</text><text x="640" y="403" font-size="20" fill="#4e6367" font-weight="400" >как принятую альтернативу.</text><text x="640" y="431" font-size="20" fill="#4e6367" font-weight="400" >Подтверждение разбора заблокировано.</text></g><line x1="585" y1="386" x2="612" y2="386" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="885" y1="474" x2="885" y2="511" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><g class="product-node" data-x="48" data-y="519" data-width="1104" data-height="154"><rect x="48" y="519" width="1104" height="154" rx="14" fill="#e4eee6"/><rect x="48" y="538" width="4" height="116" rx="2" fill="#14655c"/><text x="72" y="558" font-size="26" fill="#142b35" font-weight="600" >Правка оператора</text><text x="72" y="592" font-size="20" fill="#4e6367" font-weight="400" >Прочитать письмо → убрать преждевременное событие → уточнить запрос.</text><text x="72" y="620" font-size="20" fill="#4e6367" font-weight="400" >Отдельно выяснить: тихий ли номер? Выходят ли окна во двор?</text><text x="72" y="648" font-size="20" fill="#4e6367" font-weight="400" >Сохранить новую версию с причиной исправления.</text></g><line x1="600" y1="676" x2="600" y2="710" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><g class="product-node" data-x="48" data-y="718" data-width="1104" data-height="121"><rect x="48" y="718" width="1104" height="121" rx="14" fill="#e5edf5"/><rect x="48" y="737" width="4" height="83" rx="2" fill="#275b8c"/><text x="72" y="757" font-size="26" fill="#142b35" font-weight="600" >Повторная проверка и решение человека</text><text x="72" y="791" font-size="20" fill="#4e6367" font-weight="400" >Оператор подтверждает корректность разбора или отклоняет его с пояснением.</text></g><text x="48" y="883" font-size="22" fill="#4e6367" font-weight="400" >Первоначальная ошибка остаётся в истории. Исправленная версия хранится отдельно.</text></g></svg>
