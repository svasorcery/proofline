<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">История документов и решений</title><desc id="desc">Первый разбор и решение связаны с первым набором источников. После обновления материалов создаётся новый анализ и отдельное решение. Старые основания остаются доступны.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="880" rx="0" fill="#f6f3eb"/><text x="48" y="44" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">ИСТОРИЯ / ДОКУМЕНТЫ И РЕШЕНИЯ</text><text x="48" y="102" font-size="43" fill="#142b35" font-weight="600" >Что было известно в момент решения</text><text x="48" y="165" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">ПЕРВЫЙ РАЗБОР</text><g class="product-node" data-x="48" data-y="190" data-width="340" data-height="174"><rect x="48" y="190" width="340" height="174" rx="14" fill="#e4eee6"/><rect x="48" y="209" width="4" height="136" rx="2" fill="#14655c"/><text x="72" y="229" font-size="26" fill="#142b35" font-weight="600" >Источники № 1</text><text x="72" y="263" font-size="20" fill="#4e6367" font-weight="400" >Письмо с условиями</text><text x="72" y="291" font-size="20" fill="#4e6367" font-weight="400" >Ответа отеля пока нет</text><text x="72" y="319" font-size="20" fill="#4e6367" font-weight="400" >Текст сохранён</text></g><g class="product-node" data-x="430" data-y="190" data-width="340" data-height="174"><rect x="430" y="190" width="340" height="174" rx="14" fill="#fffefb"/><rect x="430" y="209" width="4" height="136" rx="2" fill="#14655c"/><text x="454" y="229" font-size="26" fill="#142b35" font-weight="600" >Разбор № 1</text><text x="454" y="263" font-size="20" fill="#4e6367" font-weight="400" >Согласие с условиями</text><text x="454" y="291" font-size="20" fill="#4e6367" font-weight="400" >Нужны подтверждения</text><text x="454" y="319" font-size="20" fill="#4e6367" font-weight="400" >Цитаты из источников № 1</text></g><g class="product-node" data-x="812" data-y="190" data-width="340" data-height="174"><rect x="812" y="190" width="340" height="174" rx="14" fill="#e5edf5"/><rect x="812" y="209" width="4" height="136" rx="2" fill="#275b8c"/><text x="836" y="229" font-size="26" fill="#142b35" font-weight="600" >Решение № 1</text><text x="836" y="263" font-size="20" fill="#4e6367" font-weight="400" >Оператор проверил</text><text x="836" y="291" font-size="20" fill="#4e6367" font-weight="400" >и подтвердил разбор</text><text x="836" y="319" font-size="20" fill="#4e6367" font-weight="400" >Комментарий и время</text></g><line x1="390" y1="277" x2="424" y2="277" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="772" y1="277" x2="806" y2="277" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="405" width="1104" height="86" rx="14" fill="#142b35"/><text x="72" y="457" font-size="24" fill="#fffefb" font-weight="400" >Пришли новые сведения → изменился набор источников → нужен новый анализ</text><text x="48" y="544" font-size="16" fill="#4e6367" font-weight="600" letter-spacing="1.5">ПОСЛЕ ОБНОВЛЕНИЯ МАТЕРИАЛОВ</text><g class="product-node" data-x="48" data-y="570" data-width="340" data-height="174"><rect x="48" y="570" width="340" height="174" rx="14" fill="#e4eee6"/><rect x="48" y="589" width="4" height="136" rx="2" fill="#14655c"/><text x="72" y="609" font-size="26" fill="#142b35" font-weight="600" >Источники № 2</text><text x="72" y="643" font-size="20" fill="#4e6367" font-weight="400" >Прежние документы</text><text x="72" y="671" font-size="20" fill="#4e6367" font-weight="400" >Новый ответ отеля</text><text x="72" y="699" font-size="20" fill="#4e6367" font-weight="400" >Новый снимок материалов</text></g><g class="product-node" data-x="430" data-y="570" data-width="340" data-height="174"><rect x="430" y="570" width="340" height="174" rx="14" fill="#fffefb"/><rect x="430" y="589" width="4" height="136" rx="2" fill="#14655c"/><text x="454" y="609" font-size="26" fill="#142b35" font-weight="600" >Разбор № 2</text><text x="454" y="643" font-size="20" fill="#4e6367" font-weight="400" >Анализ новых сведений</text><text x="454" y="671" font-size="20" fill="#4e6367" font-weight="400" >Свои факты и цитаты</text><text x="454" y="699" font-size="20" fill="#4e6367" font-weight="400" >Повторные проверки</text></g><g class="product-node" data-x="812" data-y="570" data-width="340" data-height="174"><rect x="812" y="570" width="340" height="174" rx="14" fill="#e5edf5"/><rect x="812" y="589" width="4" height="136" rx="2" fill="#275b8c"/><text x="836" y="609" font-size="26" fill="#142b35" font-weight="600" >Решение № 2</text><text x="836" y="643" font-size="20" fill="#4e6367" font-weight="400" >Оператор проверяет</text><text x="836" y="671" font-size="20" fill="#4e6367" font-weight="400" >новую версию</text><text x="836" y="699" font-size="20" fill="#4e6367" font-weight="400" >и оставляет решение</text></g><line x1="390" y1="657" x2="424" y2="657" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="772" y1="657" x2="806" y2="657" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="800" font-size="22" fill="#4e6367" font-weight="400" >Старая цитата открывает старый текст. Новые сведения не изменяют прошлое решение.</text><text x="48" y="840" font-size="22" fill="#14655c" font-weight="400" >В истории можно восстановить основания каждого разбора.</text></g></svg>
